name: CI

on:
  pull_request:
    branches: [develop, uat, master]
  push:
    branches: [develop, uat, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Syntax check
        run: pnpm run check:syntax

      - name: Lint
        run: pnpm run --if-present lint

      - name: Typecheck
        run: pnpm run --if-present typecheck

      - name: SQL check
        run: pnpm run --if-present sql:check

      - name: Build
        run: pnpm run build

  domain-tests:
    name: domain-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Service containers cannot pass --replSet, and transactions need a replica set.
      - name: Start MongoDB replica set
        run: |
          docker run -d --name connect-mongo -p 27017:27017 mongo:7 --replSet rs0
          for i in $(seq 1 30); do
            if docker exec connect-mongo mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate().ok }'; then
              break
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            state=$(docker exec connect-mongo mongosh --quiet --eval 'rs.status().myState' || true)
            [ "$state" = "1" ] && exit 0
            sleep 1
          done
          echo "::error::MongoDB replica set did not become primary"
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Uses .env.test: throwaway local MongoDB, fake secrets.
      - name: Tests (@money, @permission, unit + integration)
        run: pnpm test
