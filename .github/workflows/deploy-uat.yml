name: Deploy UAT

on:
  push:
    branches: [uat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-uat
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  HEALTH_PATH: /api/v1/health

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@60

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      # Vercel secret env values are not readable at build time, so setup uses a GitHub secret.
      - name: Set up UAT database (collections, validation, indexes)
        env:
          MONGODB_URI: ${{ secrets.UAT_MONGODB_URI }}
          MONGODB_DB: connect
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::Missing repository secret UAT_MONGODB_URI"
            exit 1
          fi
          pnpm db:setup

      # Creates the test accounts only on the first deploy; later runs skip (reset: Reset UAT database workflow).
      - name: Seed UAT test accounts
        env:
          APP_ENV: uat
          MONGODB_URI: ${{ secrets.UAT_MONGODB_URI }}
          MONGODB_DB: connect
          SEED_PASSWORD: ${{ secrets.UAT_SEED_PASSWORD }}
        run: |
          if [ -z "$SEED_PASSWORD" ]; then
            echo "::warning::UAT_SEED_PASSWORD not set, test accounts not seeded"
            exit 0
          fi
          pnpm seed

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        if: ${{ vars.UAT_BASE_URL != '' }}
        env:
          BASE_URL: ${{ vars.UAT_BASE_URL }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL$HEALTH_PATH")
            echo "Attempt $i: $BASE_URL$HEALTH_PATH -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Health check failed at $BASE_URL$HEALTH_PATH"
          exit 1
