<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card">
        <header class="d-flex justify-content-between align-items-center mb-4">
          <span class="brand">CONNECT</span>
          <div class="btn-group btn-group-sm" role="group" aria-label="Language">
            <button type="button" class="btn btn-outline-secondary" data-lang="vi">VI</button>
            <button type="button" class="btn btn-outline-secondary" data-lang="en">EN</button>
          </div>
        </header>

        <h1 class="h4 mb-1" data-i18n="title"></h1>
        <p class="text-muted mb-4" data-i18n="subtitle"></p>

        <form id="sign-in" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label" data-i18n="email"></label>
            <input id="email" type="email" class="form-control form-control-lg" autocomplete="username" required />
          </div>
          <div class="mb-4">
            <label for="password" class="form-label" data-i18n="password"></label>
            <input id="password" type="password" class="form-control form-control-lg" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100" data-i18n="submit"></button>
          <p id="form-message" class="small mt-3 mb-0" role="status"></p>
        </form>
      </section>

      <footer class="status-line" id="status" role="status"></footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
